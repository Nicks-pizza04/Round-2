<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nkosikaze ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  text-align:center;
  color:white;
}

#envelope{
  margin-top:100px;
  background:white;
  color:#ff4d6d;
  padding:20px 30px;
  border-radius:15px;
  cursor:pointer;
  font-weight:bold;
  display:inline-block;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

#content{
  display:none;
  padding:20px;
}

h1{
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #fff; }
  to{ text-shadow:0 0 30px #ff1744; }
}

img{
  max-width:300px;
  width:90%;
  border-radius:20px;
  margin:20px auto;
  display:block;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

#message{
  max-width:600px;
  margin:auto;
  line-height:1.6;
  background:rgba(0,0,0,0.3);
  padding:20px;
  border-radius:20px;
  font-size:15px;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  font-size:16px;
  margin:15px;
  cursor:pointer;
  font-weight:bold;
  background:white;
  color:#ff4d6d;
}

#noBtn{
  position:relative;
}

.heart{
  position:absolute;
  font-size:20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

.burst{
  position:absolute;
  font-size:24px;
  animation:explode 1s forwards;
}

@keyframes explode{
  to{
    transform:translate(var(--x),var(--y));
    opacity:0;
  }
}

#ring{
  font-size:50px;
  display:none;
  margin-top:20px;
  animation:spin 2s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0);}
  to{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div id="envelope">💌 Tap to Open Your Love Letter</div>

<div id="content">

<h1>Nkosikaze❤️</h1>

<img src="yourphoto.jpg.JPG">

<div id="message"></div>

<audio id="bgMusic" loop preload="auto">
<source src="ssstik.io_1770851481821.mp3.mp3" type="audio/mpeg">
</audio>

<h2>Will you be my Valentine? 💖</h2>

<button onclick="yesClicked(event)">YES 💕</button>
<button id="noBtn">NO 🙈</button>

<div id="ring">💍</div>

</div>

<script>

document.getElementById("envelope").onclick=function(){
  this.style.display="none";
  document.getElementById("content").style.display="block";
  
  let music=document.getElementById("bgMusic");
  music.play().catch(()=>{});
  
  typeWriter();
};

const text = `Hi Princess❤️so I’ve been working on this website for like a week now and haii all I have to say is coding is a lot of work Shem but it’s worth it because I get to put a smile on my wife’s pretty face. Actually pretty is an understatement I get to make my gorjus gorjus wife smile hey🥺and yes I know how to spell🙄. But yeah right now I’m not in gabs and this is the cutest way of asking you to be my valentine that I thought of😚. The website is going to stay on the internet for as long as God knows when so whenever you need to cheer yourself up just remember that there’s a guy(your man) who spent weeks trying to make a website for his Princess❤️. And like I said distance or no distance it doesn’t change how I feel about you❤️
With love 
Umyeni wakho❤️
(Ps. If you say no you have to say it in Chinese and do a backflip😉)
`;

let i=0;
function typeWriter(){
  if(i<text.length){
    document.getElementById("message").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,25);
  }
}

function yesClicked(e){
  const btn=e.target;
  for(let j=0;j<40;j++){
    const heart=document.createElement("div");
    heart.className="burst";
    heart.innerHTML="❤️";
    heart.style.left=btn.offsetLeft+"px";
    heart.style.top=btn.offsetTop+"px";
    heart.style.setProperty("--x",(Math.random()*400-200)+"px");
    heart.style.setProperty("--y",(Math.random()*-400)+"px");
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1000);
  }
  document.getElementById("ring").style.display="block";
}

document.getElementById("noBtn").addEventListener("mouseover",function(){
  this.style.position="absolute";
  this.style.left=Math.random()*window.innerWidth+"px";
  this.style.top=Math.random()*window.innerHeight+"px";
});

setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},800);

</script>

</body>
</html>
